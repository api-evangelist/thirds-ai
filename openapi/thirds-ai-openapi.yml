x-unmatched-v1-responses:
  description: A request below /v1 that matches no operation receives the shared safe envelope. OpenAPI has no standard path
    item for an unmatched route, so this extension records the fallback contract without claiming that a catch-all operation
    exists.
  '404':
    $ref: '#/components/responses/NotFound'
  '431':
    $ref: '#/components/responses/RequestHeadersTooLarge'
components:
  headers:
    XRequestId:
      description: The UUID that identifies this request and matches error.request_id on an error response.
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AccountEmailRequest:
      type: object
      properties:
        email:
          type: string
        next:
          type: string
          description: A safe local path after proof; defaults to /account.
      required:
      - email
      additionalProperties: false
    AccountEmailAccepted:
      type: object
      additionalProperties: false
    WebhookTest:
      type: object
      properties:
        status_code:
          type:
          - integer
          - 'null'
          minimum: 200
          maximum: 599
        delivered:
          type: boolean
      required:
      - status_code
      - delivered
      additionalProperties: false
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          pattern: ^wa_[0-9a-f]{32}$
        event:
          type: string
          enum:
          - render.succeeded
          - render.failed
          - render.cancelled
        created_at:
          type: string
          format: date-time
        status_code:
          type:
          - integer
          - 'null'
          minimum: 200
          maximum: 599
          description: Null when no HTTP status is received.
        is_test:
          type: boolean
          description: True for a sample sent by the test action.
        retry_count:
          type: integer
          minimum: 0
          maximum: 7
      required:
      - id
      - event
      - created_at
      - status_code
      - retry_count
      - is_test
      additionalProperties: false
    WebhookDeliveryList:
      type: object
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WebhookDelivery'
      required:
      - data
      additionalProperties: false
    PublicStats:
      type: object
      description: Measured facts shown on the public sales site.
      properties:
        renders_served:
          type: integer
          minimum: 0
        gallery_templates:
          type: integer
          minimum: 0
        uptime_percent:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        uptime_days:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - operational
          - degraded
          - downtime
          - maintenance
          - unavailable
      required:
      - renders_served
      - gallery_templates
      - uptime_percent
      - uptime_days
      - status
      additionalProperties: false
    TestimonialRequest:
      type: object
      description: One private testimonial offer and the fresh browser check that protects it.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        company:
          type: string
          minLength: 2
          maxLength: 120
        quote:
          type: string
          minLength: 20
          maxLength: 1000
        permission:
          type: boolean
          const: true
          description: The visitor permits contact about the quote. This does not publish it.
        captcha_token:
          type: string
          minLength: 1
          maxLength: 2048
      required:
      - name
      - company
      - quote
      - permission
      - captcha_token
      additionalProperties: false
    TestimonialSubmission:
      type: object
      description: The private submission identifier returned after storage.
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
      additionalProperties: false
    UploadedImage:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - media_type
      - byte_size
      - width
      - height
      properties:
        id:
          type: string
          pattern: ^asset_[a-f0-9]{32}$
        reference:
          type: string
          pattern: ^asset://asset_[a-f0-9]{32}$
          description: Private template reference. This is not a fetchable URL.
        media_type:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/webp
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        width:
          type: integer
          minimum: 1
          maximum: 7680
          description: Display width after image orientation.
        height:
          type: integer
          minimum: 1
          maximum: 7680
          description: Display height after image orientation.
    FieldDetail:
      type: object
      description: One request field that failed, its fixed safe reason, and an optional bounded source location. Details
        never carry template source, customer values, rendered output, or raw evaluator prose.
      properties:
        field:
          type: string
          maxLength: 260
          description: The path to the field, such as "pdf.scale". Schema errors use data followed by a JSON Pointer, such
            as data/items/0/count. The pointer is cut at 256 UTF-8 bytes. Empty for a problem with the whole document.
        reason:
          type: string
          enum:
          - malformed JSON
          - missing field
          - unknown field
          - wrong type
          - invalid value
          - A required value is missing.
          - Use the expected value type.
          - Declare this variable before using it.
          - Choose an allowed value.
          - Use the required format.
          - Add a value.
          - Use a shorter value.
          - Use a number within the allowed range.
          - Check this value against its data rule.
          description: A fixed, safe reason. It never repeats the value the caller sent.
        line:
          type: integer
          minimum: 1
          maximum: 1000000
          description: The one-based template source line when the evaluator provides one within the published bound.
        column:
          type: integer
          minimum: 1
          maximum: 1000000
          description: The one-based template source column when the evaluator provides one within the published bound.
      required:
      - field
      - reason
      additionalProperties: false
    BrandKitId:
      type: string
      pattern: ^kit_[0-9a-f]{32}$
    BrandAssetId:
      type: string
      pattern: ^asset_[0-9a-f]{32}$
    BrandKitWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
