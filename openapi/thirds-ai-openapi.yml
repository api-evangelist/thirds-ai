          - if:
              properties:
                format:
                  const: png
            then:
              not:
                required:
                - quality
            else:
              properties:
                quality:
                  default: 80
          - if:
              properties:
                format:
                  const: jpeg
            then:
              properties:
                transparent:
                  const: false
          additionalProperties: false
        javascript:
          type: object
          properties:
            mode:
              type: string
              enum:
              - disabled
              - enabled
          additionalProperties: false
